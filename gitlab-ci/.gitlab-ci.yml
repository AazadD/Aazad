stages:
  - test
  - deploy

lint-playbook:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache ansible-lint
  script:
    - ansible-lint ansible/update.yml
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-job:
  stage: deploy
  tags:
    - self-hosted
  script:
    - ansible-playbook -i ansible/hosts.ini ansible/update.yml
    - curl -f http://127.0.0.1/health
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
